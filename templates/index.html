{% extends "base.html" %}

{% block content %}
<div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full">
    <h1 class="text-3xl font-bold mb-6 text-center text-white">Welcome to QuizIQ</h1>
    <p class="text-center text-gray-400 mb-8">
        Select a discipline and a theme to begin your adaptive test.
    </p>

    <!-- 
        This form would be populated dynamically from the backend in a real app.
        The user would select a discipline, and then HTMX could fetch the themes for that discipline.
        For now, we'll assume a known user and theme for simplicity to start the session.
    -->
    <form hx-post="/start-test" hx-push-url="true" hx-target="body">
        
        <!-- User Selection (Placeholder) -->
        <div class="mb-4">
            <label for="user_id" class="block text-sm font-medium text-gray-300 mb-2">Select User</label>
            <select id="user_id" name="user_id" class="w-full bg-gray-700 text-white border-gray-600 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                <!-- In a real app, loop through users passed to the template -->
                <option value="1">admin</option>
                <option value="2">moderator</option>
                <option value="3" selected>tester</option>
            </select>
        </div>

        <!-- Theme Selection (Placeholder) -->
        <div class="mb-6">
            <label for="theme_id" class="block text-sm font-medium text-gray-300 mb-2">Select Theme</label>
            <select id="theme_id" name="theme_id" class="w-full bg-gray-700 text-white border-gray-600 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                <!-- In a real app, loop through themes passed to the template -->
                <option value="1">Algebra</option>
                <option value="2" selected>Geometry</option>
                <option value="3">Calculus</option>
                <option value="4">Statistics</option>
            </select>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
            Start Test
        </button>
    </form>
</div>
{% endblock %}
