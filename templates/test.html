{% extends "base.html" %}

{% block content %}
    <!-- 
      This is the main container for the adaptive quiz.
      - On page load, it immediately triggers a GET request to fetch the first question.
      - All subsequent questions and the final results will be loaded into this div.
    -->
    <div 
      id="quiz-container" 
      hx-get="/sessions/{{ session_id }}/next-question" 
      hx-trigger="load"
      hx-swap="innerHTML"
    >
      <!-- Initial loading state -->
      <div class="text-center p-8">
        <p class="text-lg text-gray-400">Loading your first question...</p>
        <!-- You could add a spinner here -->
        <svg class="animate-spin h-8 w-8 text-white mx-auto mt-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>
    </div>
{% endblock %}
